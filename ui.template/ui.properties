# bob-crew UI settings: copy to ~/.bobcrew/ui.properties (scripts/init-ui-config.sh does) and fill in.
# Lines starting with # are comments. Never commit this file once it holds a token.

# --- one server ---------------------------------------------------------------
# The server's URL, as its certificate names it
bobcrew.ui.server-url=https://my-server.example.com:8443
# The token issued on the server (issue-token --user <you>); token-file keeps it out of this file.
# With a Keycloak login (below), leave both out: a server with a token of its own keeps using it.
#bobcrew.ui.token=<token>
bobcrew.ui.token-file=${user.home}/.bobcrew/token
# The server's private CA (certs/ca.crt on the server)
bobcrew.ui.ca-file=${user.home}/.bobcrew/ca.crt

# --- or several servers (then leave the three lines above out) ---------------
#bobcrew.ui.servers.prod.url=https://prod.example.com:8443
#bobcrew.ui.servers.prod.token-file=${user.home}/.bobcrew/prod.token
#bobcrew.ui.servers.prod.ca-file=${user.home}/.bobcrew/prod-ca.crt
#bobcrew.ui.servers.dev.url=https://dev.example.com:8443
#bobcrew.ui.servers.dev.token-file=${user.home}/.bobcrew/dev.token
#bobcrew.ui.servers.dev.ca-file=${user.home}/.bobcrew/dev-ca.crt

# --- or log in with Keycloak instead of tokens --------------------------------
# The realm's issuer (scripts/deploy-keycloak.sh prints it) and, for a private CA, its certificate
#bobcrew.ui.oidc.issuer-uri=https://keycloak.example.com:8543/realms/bobcrew
#bobcrew.ui.oidc.ca-file=${user.home}/.bobcrew/keycloak-ca.crt

# Role manifests (default: ~/.bobcrew/roles)
#bobcrew.ui.roles-dir=${user.home}/.bobcrew/roles
