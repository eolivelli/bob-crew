# QEMU inside a privileged session container: no SELinux/AppArmor labels and no systemd, so no security
# driver and no cgroups of libvirt's own (the container's limits apply). Running QEMU as the container's
# root adds nothing: the container is privileged already.
security_driver = "none"
cgroup_controllers = [ ]
user = "root"
group = "root"
dynamic_ownership = 0
