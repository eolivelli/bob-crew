server:
  port: ${BOBCREW_PORT:8443}
  ssl:
    bundle: bobcrew
  shutdown: graceful

spring:
  application:
    name: bobcrew-server
  threads:
    virtual:
      enabled: true
  ssl:
    bundle:
      pem:
        bobcrew:
          keystore:
            certificate: ${bobcrew.tls.certificate}
            private-key: ${bobcrew.tls.private-key}

bobcrew:
  tls:
    certificate: ${BOBCREW_TLS_CERT:file:certs/server.crt}
    private-key: ${BOBCREW_TLS_KEY:file:certs/server.key}
  max-sessions: 8
  # Most open sessions one user may have at a time (0: no limit beyond max-sessions)
  max-sessions-per-user: ${BOBCREW_MAX_SESSIONS_PER_USER:4}
  # How long initialize, session/new and other short requests may take
  request-timeout: 30s
  # How long one prompt turn may take
  prompt-timeout: 10m
  # How long a permission request waits for an answer before it is rejected
  permission-timeout: 2m
  # Sessions with no activity for this long are closed; 0 disables the check
  idle-timeout: 12h
  # How many events each session keeps for clients that connect or reconnect
  event-buffer-size: 5000
  # Whether clients may download files from a session's workspace
  file-downloads-enabled: ${BOBCREW_FILE_DOWNLOADS_ENABLED:false}
  # Whether clients may upload files into a session's workspace, and how large one may be. Uploads are
  # written by the session's (non-root) user, so they can only go where the agent itself can write.
  file-uploads-enabled: ${BOBCREW_FILE_UPLOADS_ENABLED:true}
  max-upload-size: ${BOBCREW_MAX_UPLOAD_SIZE:100MB}
  agent:
    # The command run in each session's container (the image's entrypoint runs it). It must speak
    # ACP on stdin/stdout. --auto-approve is deliberately absent: users answer permission requests.
    command: ${BOBCREW_AGENT_COMMAND:bob,acp,--trust,--accept-license,--disable-mcp,--disable-subagents}
    # Passed to the container as BOB_API_KEY and BOBSHELL_API_KEY; never logged
    api-key: ${BOB_API_KEY:}
  docker:
    # The Docker daemon; the server's user must be allowed to use it
    host: ${DOCKER_HOST:unix:///var/run/docker.sock}
    # Docker Engine API version to speak (Docker 29 accepts 1.44 and newer)
    api-version: ${BOBCREW_DOCKER_API_VERSION:1.44}
    # Labels this server's containers; containers with this id left by an earlier run are removed
    # at startup. Servers sharing one Docker daemon need different ids.
    instance-id: ${BOBCREW_INSTANCE_ID:default}
    # Image used when the client names none. Images are never pulled: they must be present on the
    # Docker host (scripts/build-images.sh, scripts/push-images.sh).
    default-image: ${BOBCREW_DEFAULT_IMAGE:bobcrew/bob-base:latest}
    # Images a client may name, comma separated; '*' matches any characters (so bobcrew/* is every tag of
    # every bobcrew/ image). The default image is always allowed. The API checks this, whatever the UI's
    # roles say: anyone with a token can call the API directly.
    allowed-images: ${BOBCREW_ALLOWED_IMAGES:bobcrew/*}
    # uid:gid the agent runs as; never root
    user: "1000:1000"
    # Limits for sessions that ask for none (0: no limit). A session can ask for its own memory and CPUs,
    # up to max-memory and max-cpus (0: no cap); with no request and no default, the cap applies.
    # Without a memory limit one session can exhaust the host's memory for everyone.
    memory-limit: ${BOBCREW_MEMORY_LIMIT:8GB}
    cpus: ${BOBCREW_CPUS:0}
    max-memory: ${BOBCREW_MAX_MEMORY:0}
    max-cpus: ${BOBCREW_MAX_CPUS:0}
    # Most processes per container (0: no limit); stops a fork bomb from taking the host down
    pids-limit: ${BOBCREW_PIDS_LIMIT:4096}
    # Docker network the containers join; the agent needs to reach its model API. Created at startup if
    # missing, as a bridge on which containers cannot reach one another (enable_icc=false). The built-in
    # networks bridge, host and none are refused: they let sessions talk to each other, or are no isolation.
    network: ${BOBCREW_DOCKER_NETWORK:bobcrew}
    # How long a container gets to exit after its input is closed, before it is killed
    stop-timeout: 5s
    # Limits on the environment variables a client may pass to a session
    max-env-vars: 32
    max-env-value-length: 32768
  git:
    # How long cloning a session's repository (shallow, one branch) may take; session creation waits for it
    clone-timeout: 10m
    # URL schemes a repository may use. URLs with credentials in them are always refused.
    allowed-schemes: https
  # Capabilities sessions may ask for, comma separated: docker (a Docker Engine of their own), libvirt
  # (virtual machines with QEMU/KVM, for Vagrant). Either one makes the session's container privileged and
  # started as root, so that the image (bobcrew/bob-power) can start the daemons; the agent itself runs as
  # docker.user. Users of such sessions can become root on this Docker host: allow them only for users you
  # trust with that. None by default.
  allowed-capabilities: ${BOBCREW_ALLOWED_CAPABILITIES:}
  # Users (token subjects, comma separated) who may see, use and close every session. Everyone else sees only
  # the sessions they created and those shared with them.
  admin-users: ${BOBCREW_ADMIN_USERS:}
  auth:
    jwt-secret-file: ${BOBCREW_JWT_SECRET_FILE:}
    revoked-jti-file: ${BOBCREW_REVOKED_JTI_FILE:}
    issuer: bobcrew
    audience: bobcrew-api

logging:
  level:
    bobcrew.agent.stderr: INFO
