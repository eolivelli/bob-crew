<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bob-crew</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside id="sidebar">
  <header>
    <h1>bob-crew</h1>
    <span id="me"></span>
  </header>
  <form id="new-session">
    <select id="new-server" required title="Server"></select>
    <input id="new-workspace" list="workspaces" placeholder="Workspace directory" required autocomplete="off">
    <datalist id="workspaces"></datalist>
    <input id="new-title" placeholder="Title (optional)" maxlength="200" autocomplete="off">
    <select id="new-role" title="Role: the prompt sent first to the new session" hidden></select>
    <button type="submit">New session</button>
  </form>
  <button id="show-roles" type="button" title="List the available roles and read their manifests">Roles</button>
  <ul id="sessions"></ul>
</aside>

<main>
  <header id="session-header" hidden>
    <div>
      <h2 id="session-title"></h2>
      <span id="session-meta"></span>
    </div>
    <div class="controls">
      <span id="session-status" class="badge"></span>
      <select id="session-mode" title="Mode"></select>
      <button id="export" type="button" title="Download the whole session as a gzipped HTML file">Export transcript</button>
      <button id="cancel" type="button">Stop</button>
      <button id="clear" type="button" class="danger" title="Start the conversation over and delete everything in the workspace; the session stays open">Clear</button>
      <button id="close" type="button" class="danger">Close session</button>
    </div>
  </header>
  <div id="notice" hidden></div>
  <section id="roles-view" hidden>
    <header>
      <h2>Roles</h2>
      <button id="hide-roles" type="button">Back</button>
    </header>
    <p id="roles-hint">Read-only. Roles are manifests (<code>*.md</code>) in the roles directory of this computer, by default <code>~/.bobcrew/roles</code>.</p>
    <div id="roles-body">
      <ul id="roles-list"></ul>
      <div id="role-detail">
        <h3 id="role-name"></h3>
        <p id="role-description"></p>
        <pre id="role-manifest"></pre>
      </div>
    </div>
  </section>
  <section id="transcript">
    <p id="empty">Select a session or create a new one.</p>
  </section>
  <form id="prompt-form" hidden>
    <textarea id="prompt" rows="3" placeholder="Ask Bob… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button type="submit">Send</button>
  </form>
</main>
<script src="links.js"></script>
<script src="transcript-export.js"></script>
<script src="app.js"></script>
</body>
</html>
