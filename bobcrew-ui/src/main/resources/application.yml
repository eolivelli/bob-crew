server:
  # Loopback only: whoever can reach the UI acts as its user (with their token, or their login), so it must not be
  # reachable from other machines
  address: 127.0.0.1
  port: ${BOBCREW_UI_PORT:8642}

spring:
  application:
    name: bobcrew-ui
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:${user.home}/.bobcrew/ui.properties

bobcrew:
  ui:
    # Single server configuration (or use bobcrew.ui.servers.<name>.* in ~/.bobcrew/ui.properties)
    server-url: ${BOBCREW_SERVER_URL:}
    token: ${BOBCREW_TOKEN:}
    token-file: ${BOBCREW_TOKEN_FILE:}
    ca-file: ${BOBCREW_CA_FILE:}
    # Logging in with an identity provider (Keycloak) instead of configured tokens: servers without a token of
    # their own get the logged-in user's. The realm's issuer, exactly as in its tokens; the client the realm has for
    # UIs; and PEM certificates to trust for its HTTPS instead of the JDK's (a private CA).
    oidc:
      issuer-uri: ${BOBCREW_UI_OIDC_ISSUER_URI:}
      client-id: ${BOBCREW_UI_OIDC_CLIENT_ID:bobcrew-ui}
      ca-file: ${BOBCREW_UI_OIDC_CA_FILE:}
    # Role manifests (*.md), one per role; read on every request
    roles-dir: ${user.home}/.bobcrew/roles
    # The values of the secrets that roles name: one JSON object, readable by its owner only (chmod 600)
    secrets-file: ${user.home}/.bobcrew/secrets.json
    # Files copied into the container user's home directory (/home/bob); read on each new session
    user-profile-dir: ${user.home}/.bobcrew/user-profile
