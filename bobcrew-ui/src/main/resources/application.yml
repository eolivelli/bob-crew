server:
  # Loopback only: the UI has no login, so it must not be reachable from other machines
  address: 127.0.0.1
  port: ${BOBCREW_UI_PORT:8642}

spring:
  application:
    name: bobcrew-ui
  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:${user.home}/.bobcrew/ui.properties

bobcrew:
  ui:
    # Single server configuration (or use bobcrew.ui.servers.<name>.* in ~/.bobcrew/ui.properties)
    server-url: ${BOBCREW_SERVER_URL:}
    token: ${BOBCREW_TOKEN:}
    token-file: ${BOBCREW_TOKEN_FILE:}
    ca-file: ${BOBCREW_CA_FILE:}
    # Role manifests (*.md), one per role; read on every request
    roles-dir: ${user.home}/.bobcrew/roles
